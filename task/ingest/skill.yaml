name: ingest
description: Discover, audit, stage, and apply single-cell paper entries
required_env: [INGEST_MODE]
optional_env:
  - INGEST_SEED_URL
  - INGEST_MAX_NEW
  - INGEST_YEAR_FROM
  - INGEST_YEAR_TO
  - INGEST_MODEL_NAME
  - INGEST_VENUE
  - INGEST_YEAR
  - INGEST_APPLY_AUTHORIZED
scripts:
  hub_query:
    args: {"repo?": str, "model?": str, "list?": bool}
  scholar_lookup:
    args: {seed: str, "limit?": int}
  search_arxiv:
    args: {query: str, "limit?": int}
  web_search:
    args: {query: str, "limit?": int}
  github_search:
    args: {query: str, "probe?": bool, "title?": str, "arxiv_id?": str, "authors?": str, "code_availability?": str}
  fetch_page:
    args: {url: str, "want?": str}
  download_pdf:
    args: {paper_url: str, "arxiv_id?": str, "doi?": str, "s2_pdf?": str, "citation_pdf_url?": str}
  extract_repo_links:
    args: {}
  acquire_repo:
    args: {repo_url: str}
  stage_entry:
    args: {payload: str}
  apply_entry:
    args: {"confirm?": bool}
  audit_scan:
    args: {"model?": str}
