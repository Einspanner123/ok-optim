name: ingest
description: Discover, audit, stage, and apply single-cell paper entries
required_env: [INGEST_MODE]
optional_env:
  - INGEST_SEED_URL
  - INGEST_MAX_NEW
  - INGEST_YEAR_FROM
  - INGEST_YEAR_TO
  - INGEST_MODEL_NAME
  - INGEST_VENUE
  - INGEST_YEAR
  - INGEST_COMMIT
  - INGEST_APPLY_AUTHORIZED
status_script: candidate
scripts:
  candidate:
    args: {action: str, "slug?": str, "payload?": str, "verdict?": str, "evidence?": str}
  scholar_lookup:
    args: {seed: str, "limit?": int}
  search_arxiv:
    args: {query: str, "limit?": int}
  web_search:
    args: {query: str, "limit?": int}
  github_search:
    args: {query: str, "probe?": bool, "slug?": str}
  fetch_page:
    args: {url: str, "want?": str}
  download_pdf:
    args: {slug: str, paper_url: str}
  extract_repo_links:
    args: {slug: str}
  acquire_repo:
    args: {slug: str, repo_url: str, "commit?": str}
  stage_entry:
    args: {slug: str}
  apply_entry:
    args: {slug: str, "confirm?": bool}
  audit_scan:
    args: {"key?": str}
