# ok 运行方案配置模板（ingest）。
# 用法: uv run ok run --task ingest --config <file> [--profile <name>]
# 优先级: --set > 本文件 > .env > 父进程环境。
# env 键必须在 task/ingest/skill.yaml 的 required_env/optional_env 白名单内，
# 未知 env 键与未知顶层键都会拒绝启动（fail-closed，防拼写错误静默失效）。

defaults:                      # 可选：所有方案共享的底座
  flags:
    tool_budget: 60
    output: human

profiles:
  discover:                    # 发现新条目（不授权落位）
    env:
      INGEST_MODE: discover
      INGEST_MAX_NEW: "3"
      INGEST_YEAR_FROM: "2023"
      INGEST_YEAR_TO: "2026"

  discover-apply:              # 发现 + 已授权落位（固化前想清楚：每次运行都授权写 hub）
    env:
      INGEST_MODE: discover
      INGEST_MAX_NEW: "3"
      INGEST_YEAR_FROM: "2023"
      INGEST_YEAR_TO: "2026"
      INGEST_APPLY_AUTHORIZED: "1"
    flags:
      thinking: low

  audit:                       # 复核已有条目
    env:
      INGEST_MODE: audit
    flags:
      timeout: 3600
