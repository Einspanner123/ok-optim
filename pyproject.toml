[project]
name = "ok-optim-agent"
version = "0.1.0"
description = "Single-cell model hub ingest & Ascend NPU optimize agent (pi runtime + task skills)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "httpx[socks]>=0.27",
    "pathspec>=1.1.1",
    "pypdf>=5.0",
    "ddgs>=9.0",
]

[project.scripts]
ok = "agent.launcher:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agent", "hubkit"]

[tool.pyright]
include = ["agent", "hubkit", "task"]
exclude = [
    "agent/vendor",
    "single-cell-hub",
    ".venv",
    "runs",
]
pythonVersion = "3.10"
typeCheckingMode = "basic"
# 有意为之：代理/外部依赖的动态用法不强行收窄
reportMissingModuleSource = "none"
