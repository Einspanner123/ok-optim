[project]
name = "ok-optim-agent"
version = "0.1.0"
description = "Single-cell model hub ingest & Ascend NPU optimize agent (pi runtime + task skills)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
    "pathspec>=1.1.1",
]

[project.scripts]
ok = "agent.launcher:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agent", "hubkit"]
